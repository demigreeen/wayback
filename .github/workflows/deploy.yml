# Публикация сайта на GitHub Pages при каждом коммите в main.
#
# Почему Pages, а не Cloudflare: сеть Cloudflare недоступна из России,
# а это наша первая аудитория. Pages оттуда открывается и раздаётся
# глобальным CDN, так что зарубежным пользователям тоже быстро.
#
# Публикуется только папка site/. Всё остальное (tools, docs, legacy)
# лежит в репозитории, но наружу не отдаётся.

name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Если пушей подряд несколько, доводим до конца только последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Версия в адресах стилей и скриптов.
      #
      # GitHub Pages отдаёт файлы с max-age=600 и файл site/_headers
      # игнорирует. Десять минут браузер держит копию, не спрашивая сервер, —
      # и посетитель легко получает новый index.html со старым player.js.
      # Один раз это уже сломало сайт: старый код искал разметку, которой
      # в новом HTML уже не было, падал, и вместе с ним отваливались кнопки.
      #
      # Хеш коммита в адресе делает такую смесь невозможной: меняется
      # разметка — меняются и адреса всех файлов, которые она подключает.
      - name: Проставить версию файлов
        run: |
          find site -name '*.html' -print0 \
            | xargs -0 sed -i "s/?v=dev/?v=${GITHUB_SHA::12}/g"
          echo "Версия: ${GITHUB_SHA::12}"
          grep -o '?v=[0-9a-f]\{12\}' site/index.html | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
